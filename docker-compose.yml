services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  prometheus:
    image: prom/prometheus:v2.54.1
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  # LOCAL TESTING ONLY: stands in for the node_exporter on your backend server.
  # If your real backend server already runs node_exporter, delete this service
  # and put that server's address in prometheus/prometheus.yml.
  node-exporter: &node-exporter
    image: prom/node-exporter:v1.8.2
    # The host's filesystem is mounted read-only so the exporter can report disk space.
    # On Linux, also add `pid: host` and use `/:/host:ro,rslave` to report the host machine fully.
    # Docker Desktop (Windows/macOS) rejects `rslave`, so here it reports Docker's own Linux VM —
    # real metrics, just not your Windows host. That VM keeps its data on /var/lib (see DISK_MOUNTPOINT).
    command: ["--path.rootfs=/host"]
    volumes:
      - /:/host:ro

  # More of them, so the dashboard has a cluster to switch between.
  node-exporter-2: *node-exporter
  node-exporter-3: *node-exporter
  node-exporter-4: *node-exporter
  node-exporter-5: *node-exporter
  node-exporter-6: *node-exporter

volumes:
  mongo-data:
